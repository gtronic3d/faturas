# Publica a app no GitHub Pages.
# 1) instala e copia os motores (Tesseract.js, modelo português, jsQR) para vendor/
# 2) corre os testes unitários (bloqueantes)
# 3) publica só os ficheiros da app (sem testes nem scripts)
# Um segundo job corre os testes ponta-a-ponta com o OCR real do browser (informativo).
name: Publicar no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: npm install
      - run: npm run vendor
      - run: npm test
      - name: Montar site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js css js icons vendor _site/
          rm -f _site/vendor/LEIA-ME.txt
          du -sh _site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  e2e-ocr-real:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openpyxl
      - run: npm install && npm run vendor
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: E2E com Tesseract.js e jsQR reais
        run: E2E_REAL_OCR=1 npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-e2e
          path: test-output/
